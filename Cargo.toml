[package]
name = "spout"
version = "0.1.13"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
getrandom = "0.4"
knuffel = "3.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde_json = "1.0"
thiserror = "2.0.18"
